# Call budget: tasks x repeats x (conditions x (1 clean + templates) + templates twins) runs x ~8 calls.
# 20 x 3 x (4 x 13 + 12) = 3840 runs, ~30k calls as configured; trim conditions or repeats before a full run.
name: phase1
model: {name: api-glm-5.3, temperature: 0.0, max_tokens: 4096}
tasks: configs/dev_tasks.yaml
repeats: 3
# Each task also runs clean twice for the noise floor, plus a counterfactual twin per fault.
conditions: [none, restart_scratch, restart_stage, always_verify]
fault_templates: data/fault_templates
detection_delays: [all]   # Phase 1 never reveals the fault; propagation only
