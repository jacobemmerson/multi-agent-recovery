[project]
name = "mar"
version = "0.1.0"
description = "Provenance-gated recovery in multi-agent workflows (CSE 291A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentdojo==0.1.35",
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
]

[project.scripts]
mar = "mar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
